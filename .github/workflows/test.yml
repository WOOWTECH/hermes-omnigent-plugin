name: Test Hermes Omnigent plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - run: python -m pip install omnigent==0.16.0
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.mjs
      - run: node --check dashboard/dist/index.js
      - run: python -c 'import pathlib; [compile(p.read_text(),str(p),"exec") for p in pathlib.Path(".").rglob("*.py") if ".git" not in p.parts]'
