name: Test Hermes Omnigent plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - run: python -m pip install omnigent==0.16.0
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.mjs
      - run: node --check dashboard/dist/index.js
      - run: python -c 'import pathlib; [compile(p.read_text(),str(p),"exec") for p in pathlib.Path(".").rglob("*.py") if ".git" not in p.parts]'
  server-contract:
    # The adapter (hermes_omnigent/adapter.py) against a real local Omnigent server instead of fakes: connect, host online,
    # status and catalog, reconnect (while the host runs, and after it died), restart_host, disconnect, connect again. No model,
    # engine or external service; run.py scrubs the environment and fails the run on any egress. The adapter and the managed
    # host keep the pinned SDK; the second server is the release the PaaS runs today (omnigent-canary.yml covers newer ones).
    name: server-contract (server ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "server-contract (server X)" for each X below is a required check of main (branch protection). Changing this list
        # means changing the protection too, or every pull request waits for a check that never runs.
        server: ['0.16.0', '0.19.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install omnigent==0.16.0
      - name: Separate installation for a newer server
        if: matrix.server != '0.16.0'
        env:
          SERVER_VERSION: ${{ matrix.server }}
        run: |
          python -m venv "$RUNNER_TEMP/server"
          "$RUNNER_TEMP/server/bin/python" -m pip install "omnigent==$SERVER_VERSION"
          echo "SERVER_OMNIGENT=$RUNNER_TEMP/server/bin/omnigent" >> "$GITHUB_ENV"
      - name: Server contract
        env:
          SERVER_VERSION: ${{ matrix.server }}
        run: |
          args=(--expect-sdk-version 0.16.0 --expect-server-version "$SERVER_VERSION" --logs "$RUNNER_TEMP/contract-logs")
          if [[ -n "${SERVER_OMNIGENT:-}" ]]; then args+=(--server-omnigent "$SERVER_OMNIGENT"); fi
          python tests/server-contract/run.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: server-contract-${{ matrix.server }}
          path: ${{ runner.temp }}/contract-logs
          retention-days: 14
