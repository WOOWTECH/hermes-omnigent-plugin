name: Omnigent canary
# Every Monday, and on demand: the plugin as shipped (the SDK hermes_omnigent/runtime.py pins, with its adapter and managed
# host) against the Omnigent releases published after that pin. Per release: does a real server of it still work with the
# pinned SDK (tests/server-contract/run.py), and can the compatibility layer still patch its SDK files
# (.github/scripts/check-omnigent-compat.py). One standing issue (label omnigent-compat) holds the table; it is commented on
# only when a result changes. Nothing here changes the plugin. Note: GitHub switches scheduled workflows off after 60 days
# without repository activity; the table in the issue shows the date of the last run.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: omnigent-canary
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      results: ${{ steps.results.outputs.results }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the pinned SDK and the newest releases above it
        # Exits 1 when a server contract is not green; anchors that no longer match are reported, not failed (all releases
        # after the pin may be in that state until the compatibility layer is upgraded).
        run: python .github/scripts/omnigent-canary.py run --work "$RUNNER_TEMP/canary" --out "$RUNNER_TEMP/results.json"
      - name: Hand the results to the report job
        id: results
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/results.json" ]]; then
            echo "results=$(cat "$RUNNER_TEMP/results.json")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: canary-logs
          path: ${{ runner.temp }}/canary/logs
          if-no-files-found: ignore
          retention-days: 14
  report:
    # Only this job can write to issues, and it installs nothing: the packages under test run in the job above.
    needs: check
    if: always() && needs.check.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Update the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ needs.check.outputs.results }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY="$(date -u +%F)" python3 .github/scripts/omnigent-canary.py report
